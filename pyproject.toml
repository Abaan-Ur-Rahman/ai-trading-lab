[project]
name = "ai-trading-lab"
version = "0.1.0"
description = "A professional quantitative research platform for AI-assisted market analysis."
requires-python = ">=3.13"
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=9.1,<10",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/config", "src/utils"]